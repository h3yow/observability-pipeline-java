# 本地可观测性管线默认参数（可用环境变量覆盖）
spring.application.name=observability-pipeline-local
server.port=8080

# 窗口与时间边界（毫秒）
observability.window-size-ms=${OBS_WINDOW_SIZE_MS:10000}
observability.lateness-ms=${OBS_LATENESS_MS:30000}
observability.future-skew-ms=${OBS_FUTURE_SKEW_MS:60000}
observability.retention-ms=${OBS_RETENTION_MS:3600000}

# 基数与速率控制
observability.max-series-per-metric=${OBS_MAX_SERIES_PER_METRIC:100}
observability.max-global-series=${OBS_MAX_GLOBAL_SERIES:1000}
observability.rate-limit-per-sec=${OBS_RATE_LIMIT_PER_SEC:10000}

# 标签约束
observability.max-label-count=20
observability.max-label-key-length=128
observability.max-label-value-length=512

# 本地存储（JSONL 追加日志）与启动重放
observability.journal-enabled=true
observability.replay-on-startup=true
observability.journal-dir=${OBS_JOURNAL_DIR:data/observability}

# 后台推进间隔
observability.tick-ms=1000
