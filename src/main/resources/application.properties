spring.application.name=observability-pipeline-java

# 窗口与时间（毫秒）
observability.window-size-millis=60000
observability.grace-period-millis=30000
observability.max-future-skew-millis=5000
observability.retention-millis=300000

# 基数与速率保护
observability.max-series-per-metric=100
observability.max-series-global=1000
# 0 表示不限制上报速率
observability.max-samples-per-second=0

# 维护推进间隔（毫秒）
observability.maintenance.interval-millis=1000

# 告警事件本地落盘（JSON Lines），留空只存内存
observability.event-log-path=
